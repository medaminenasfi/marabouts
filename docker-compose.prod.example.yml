# =============================================================================
# Marabouts – Production (VPS) – ALL config here, NO .env file needed
# =============================================================================
#
# SETUP (first time on VPS):
#   cp docker-compose.prod.example.yml docker-compose.prod.yml
#   nano docker-compose.prod.yml    ← change the 3 secrets + URLs below
#
# DEPLOY:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# WITH pgAdmin (optional):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tools up -d
#
# ── EDIT THESE VALUES ────────────────────────────────────────────────────────
#   POSTGRES_PASSWORD  → strong database password
#   JWT_SECRET         → long random string (32+ chars)
#   PGADMIN_PASSWORD   → pgAdmin login password (optional)
#   FRONTEND_URL       → https://yourdomain.com  (or http://37.187.39.209:6001)
#   NEXT_PUBLIC_API_URL → https://api.yourdomain.com  (or http://37.187.39.209:8000)
#
# Ports (free on your VPS – do not change unless conflict):
#   Frontend 6001 | Backend 8000 | pgAdmin 5050 | Postgres internal only
# =============================================================================

services:
  postgres:
    environment:
      POSTGRES_USER: marabouts
      POSTGRES_PASSWORD: marabouts@123@
      POSTGRES_DB: marabouts_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marabouts -d marabouts_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marabouts.local
      PGADMIN_DEFAULT_PASSWORD: CHANGE_ME_PGADMIN_PASSWORD
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"

  backend:
    environment:
      DATABASE_URL: postgresql://marabouts:marabouts%40123%40@postgres:5432/marabouts_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: marabouts
      JWT_SECRET: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30

      JWT_EXPIRES_IN: 7d
      PORT: 8000
      NODE_ENV: production
      FRONTEND_URL: http://37.187.39.209:6001
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://37.187.39.209:8000
        NEXT_PUBLIC_CALENDLY_URL: https://calendly.com/maraboutssyndic/30min
    environment:
      PORT: 6001
      HOSTNAME: 0.0.0.0
    ports:
      - "6001:6001"
