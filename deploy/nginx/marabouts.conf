# Marabouts – Nginx config for your existing global-nginx container
# Replace YOUR_DOMAIN and YOUR_API_DOMAIN with real domains, then:
#   1. Copy this file into global-nginx conf.d volume
#   2. docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload
#
# If global-nginx runs in Docker, proxy to host ports (marabouts exposes 6001 + 8000):
#   Use 172.17.0.1 (Docker bridge gateway on Linux) instead of 127.0.0.1

# ── Frontend ─────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location / {
        proxy_pass http://172.17.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend API ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_API_DOMAIN;

    location / {
        proxy_pass http://172.17.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After certbot SSL:
# certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN -d YOUR_API_DOMAIN
